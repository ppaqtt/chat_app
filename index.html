
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简聊天室</title>
    <style>
        :root {
            --primary-color: #667eea;
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-color: white;
            --bg-secondary: #f5f5f5;
            --text-color: #333;
            --text-secondary: #666;
            --border-color: #eee;
            --shadow-color: rgba(0,0,0,0.1);
            --hover-bg: #f0f0f0;
        }

        .dark-mode {
            --primary-color: #667eea;
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-color: #1a1a2e;
            --bg-secondary: #16213e;
            --text-color: #eee;
            --text-secondary: #ccc;
            --border-color: #2d2d44;
            --shadow-color: rgba(0,0,0,0.3);
            --hover-bg: #252540;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--primary-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--bg-color);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: background 0.3s;
        }

        .header {
            background: var(--primary-gradient);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .users-list {
            display: flex;
            gap: 10px;
            align-items: center;
            color: white;
        }

        .users-list span {
            font-size: 14px;
            opacity: 0.9;
        }

        .user-tag {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: var(--bg-secondary);
            transition: background 0.3s;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        .message.own {
            align-items: flex-end;
        }

        .message.system {
            align-items: center;
        }

        .message-reply {
            background: var(--hover-bg);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            border-left: 3px solid var(--primary-color);
        }

        .message-reply-author {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            word-wrap: break-word;
        }

        .message.own .message-bubble {
            background: var(--primary-gradient);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.other .message-bubble {
            background: var(--bg-color);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        .message.system .message-bubble {
            background: rgba(0,0,0,0.1);
            color: var(--text-secondary);
            font-size: 13px;
            padding: 8px 16px;
        }

        .message-info {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .mention-highlight {
            background: rgba(102, 126, 234, 0.3);
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 600;
        }

        .message-actions {
            display: none;
        }

        .message.own:hover .message-actions,
        .message.other:hover .message-actions {
            display: flex;
        }

        .message-action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .message-action-btn:hover {
            background: var(--hover-bg);
            color: var(--text-color);
        }

        .message-action-btn.recall {
            color: #ff6b6b;
        }

        .message-action-btn.reply {
            color: var(--primary-color);
        }

        .message.recalled .message-bubble {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .message.recalled .message-bubble::after {
            content: '（已撤回）';
            display: block;
            font-size: 12px;
            margin-top: 4px;
            color: var(--text-secondary);
        }

        .message-bubble img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            cursor: pointer;
        }

        .read-status {
            font-size: 11px;
            color: var(--text-secondary);
            margin-left: 8px;
        }

        .read-status.read {
            color: #4CAF50;
        }

        .reply-box {
            background: var(--bg-color);
            border-top: 2px solid var(--primary-color);
            padding: 12px 16px;
            display: none;
        }

        .reply-box.active {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .reply-box-content {
            flex: 1;
        }

        .reply-box-label {
            font-size: 12px;
            color: var(--primary-color);
            font-weight: 600;
        }

        .reply-box-text {
            font-size: 13px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reply-box-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        .reply-box-close:hover {
            color: var(--text-color);
        }

        .input-area {
            padding: 16px;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
            transition: background 0.3s;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, background 0.3s, color 0.3s;
            background: var(--bg-secondary);
            color: var(--text-color);
        }

        .input-area input:focus {
            border-color: var(--primary-color);
        }

        .input-area button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }

        .input-area button:active {
            transform: translateY(0);
        }

        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .login-box {
            background: var(--bg-color);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .login-box h2 {
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
            background: var(--bg-secondary);
            color: var(--text-color);
        }

        .login-box input:focus {
            border-color: var(--primary-color);
        }

        .login-box button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-box button:hover {
            transform: translateY(-2px);
        }

        .emoji-btn, .image-btn, .search-btn {
            background: none;
            border: 2px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            color: var(--text-color);
        }

        .emoji-btn:hover, .image-btn:hover, .search-btn:hover {
            border-color: var(--primary-color);
            background: rgba(102, 126, 234, 0.1);
        }

        .emoji-picker {
            position: absolute;
            bottom: 80px;
            left: 16px;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-color);
            padding: 12px;
            display: none;
            flex-wrap: wrap;
            max-width: 200px;
            gap: 8px;
        }

        .emoji-picker.active {
            display: flex;
        }

        .emoji-item {
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.2s;
            width: calc(25% - 8px);
            text-align: center;
        }

        .emoji-item:hover {
            background: var(--hover-bg);
            transform: scale(1.2);
        }

        .typing-indicator {
            position: absolute;
            bottom: 70px;
            left: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            display: none;
        }

        .typing-indicator.active {
            display: block;
        }

        .chat-mode-toggle {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .chat-mode-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .chat-mode-btn.active {
            background: white;
            color: var(--primary-color);
        }

        .room-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .room-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .private-chat-panel {
            position: absolute;
            top: 60px;
            right: 20px;
            width: 250px;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-color);
            display: none;
            max-height: 300px;
            overflow-y: auto;
            z-index: 50;
        }

        .private-chat-panel.active {
            display: block;
        }

        .private-chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: var(--text-color);
        }

        .private-chat-user {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
            color: var(--text-color);
        }

        .private-chat-user:hover {
            background: var(--hover-bg);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            font-weight: 600;
        }

        .private-target-info {
            flex: 1;
        }

        .private-target-name {
            font-size: 14px;
            color: var(--text-color);
            font-weight: 500;
        }

        .private-target-status {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .private-badge {
            background: #ff6b6b;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }

        .room-panel {
            position: absolute;
            top: 60px;
            left: 20px;
            width: 250px;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-color);
            display: none;
            max-height: 400px;
            overflow-y: auto;
            z-index: 50;
        }

        .room-panel.active {
            display: block;
        }

        .room-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: var(--text-color);
        }

        .room-item {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            color: var(--text-color);
        }

        .room-item:hover {
            background: var(--hover-bg);
        }

        .room-item.active {
            background: rgba(102, 126, 234, 0.1);
            color: var(--primary-color);
            font-weight: 600;
        }

        .room-create {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .room-create input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-color);
        }

        .room-create button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .mention-suggestions {
            position: absolute;
            bottom: 80px;
            left: 60px;
            background: var(--bg-color);
            border-radius: 8px;
            box-shadow: 0 4px 20px var(--shadow-color);
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 100;
        }

        .mention-suggestions.active {
            display: block;
        }

        .mention-suggestion {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
            color: var(--text-color);
        }

        .mention-suggestion:hover {
            background: var(--hover-bg);
        }

        .search-panel {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-color);
            display: none;
            z-index: 100;
        }

        .search-panel.active {
            display: block;
        }

        .search-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .search-header input {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-color);
        }

        .search-results {
            max-height: 400px;
            overflow-y: auto;
        }

        .search-result-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .search-result-item:hover {
            background: var(--hover-bg);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-author {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .search-result-content {
            font-size: 14px;
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>欢迎来到聊天室</h2>
            <input type="text" id="usernameInput" placeholder="输入你的昵称" maxlength="20" autocomplete="off">
            <button id="loginBtn">进入聊天室</button>
        </div>
    </div>

    <div class="chat-container">
        <div class="header">
            <h1>极简聊天室</h1>
            <div class="header-controls">
                <button class="theme-btn" id="themeBtn">🌙</button>
                <button class="search-btn" id="searchBtn">🔍</button>
                <div class="chat-mode-toggle">
                    <button class="chat-mode-btn active" id="groupChatBtn">群聊</button>
                    <button class="chat-mode-btn" id="privateChatBtn">私聊</button>
                </div>
                <button class="room-btn" id="roomBtn">🏠 房间</button>
                <div class="users-list" id="usersList">
                    <span>在线：0 人</span>
                </div>
            </div>
        </div>

        <div class="search-panel" id="searchPanel">
            <div class="search-header">
                <input type="text" id="searchInput" placeholder="搜索聊天记录...">
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

        <div class="private-chat-panel" id="privateChatPanel">
            <div class="private-chat-header">选择私聊对象</div>
            <div id="privateChatUsers"></div>
        </div>
        <div class="room-panel" id="roomPanel">
            <div class="room-header">选择聊天室</div>
            <div id="roomList"></div>
            <div class="room-create">
                <input type="text" id="newRoomInput" placeholder="新房间名称">
                <button id="createRoomBtn">创建</button>
            </div>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="typing-indicator" id="typingIndicator"></div>
        <div class="emoji-picker" id="emojiPicker"></div>
        <div class="mention-suggestions" id="mentionSuggestions"></div>
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        
        <div class="reply-box" id="replyBox">
            <div class="reply-box-content">
                <div class="reply-box-label">回复</div>
                <div class="reply-box-text" id="replyBoxText"></div>
            </div>
            <button class="reply-box-close" id="replyBoxClose">×</button>
        </div>

        <div class="input-area">
            <button class="emoji-btn" id="emojiBtn">😀</button>
            <button class="image-btn" id="imageBtn">🖼️</button>
            <input type="text" id="messageInput" placeholder="输入消息..." maxlength="500" autocomplete="off">
            <button id="sendBtn">发送</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
