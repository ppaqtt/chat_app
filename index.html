
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简聊天室</title>
    <style>
        :root {
            --primary-color: #667eea;
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-color: white;
            --bg-secondary: #f5f5f5;
            --text-color: #333;
            --text-secondary: #666;
            --border-color: #eee;
            --shadow-color: rgba(0,0,0,0.1);
            --hover-bg: #f0f0f0;
        }

        .dark-mode {
            --primary-color: #667eea;
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-color: #1a1a2e;
            --bg-secondary: #16213e;
            --text-color: #eee;
            --text-secondary: #ccc;
            --border-color: #2d2d44;
            --shadow-color: rgba(0,0,0,0.3);
            --hover-bg: #252540;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--primary-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--bg-color);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: background 0.3s;
        }

        .header {
            background: var(--primary-gradient);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .settings-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .settings-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .users-list {
            display: flex;
            gap: 10px;
            align-items: center;
            color: white;
        }

        .users-list span {
            font-size: 14px;
            opacity: 0.9;
        }

        .user-tag {
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: var(--bg-secondary);
            transition: background 0.3s;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        .message.own {
            align-items: flex-end;
        }

        .message.system {
            align-items: center;
        }

        .message-reply {
            background: var(--hover-bg);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            border-left: 3px solid var(--primary-color);
        }

        .message-reply-author {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            word-wrap: break-word;
        }

        .message.own .message-bubble {
            background: var(--primary-gradient);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.other .message-bubble {
            background: var(--bg-color);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        .message.system .message-bubble {
            background: rgba(0,0,0,0.1);
            color: var(--text-secondary);
            font-size: 13px;
            padding: 8px 16px;
        }

        .message-info {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .mention-highlight {
            background: rgba(102, 126, 234, 0.3);
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 600;
        }

        .message-actions {
            display: none;
        }

        .message.own:hover .message-actions,
        .message.other:hover .message-actions {
            display: flex;
        }

        .message-action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .message-action-btn:hover {
            background: var(--hover-bg);
            color: var(--text-color);
        }

        .message-action-btn.recall {
            color: #ff6b6b;
        }

        .message-action-btn.reply {
            color: var(--primary-color);
        }

        .message-action-btn.react {
            color: #ff9f43;
        }

        .message-action-btn.translate {
            color: #3498db;
        }

        .message-action-btn.pin {
            color: #e74c3c;
        }

        .message-translation {
            margin-top: 8px;
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            border-left: 3px solid #3498db;
        }

        .message-translation-label {
            font-weight: 600;
            color: #3498db;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .pinned-messages-bar {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 8px 16px;
            display: none;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .pinned-messages-bar.active {
            display: flex;
        }

        .pinned-message-item {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .pinned-message-item:hover {
            background: rgba(255,255,255,0.3);
        }

        .pinned-message-preview {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message.pinned {
            background: rgba(231, 76, 60, 0.1);
            border-left: 3px solid #e74c3c;
            padding: 8px;
            border-radius: 8px;
        }

        .message-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .message-reaction {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .message-reaction:hover {
            background: var(--hover-bg);
            border-color: var(--primary-color);
        }

        .reaction-emoji {
            font-size: 14px;
        }

        .reaction-count {
            color: var(--text-color);
            font-weight: 600;
        }

        .reaction-users {
            position: absolute;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            color: var(--text-secondary);
            box-shadow: 0 2px 8px var(--shadow-color);
            z-index: 10;
            display: none;
            max-width: 200px;
        }

        .reaction-users.active {
            display: block;
        }

        .reaction-selector {
            position: absolute;
            bottom: 80px;
            background: var(--bg-color);
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--shadow-color);
            padding: 8px;
            display: none;
            gap: 4px;
            z-index: 100;
        }

        .reaction-selector.active {
            display: flex;
        }

        .reaction-selector-item {
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .reaction-selector-item:hover {
            background: var(--hover-bg);
            transform: scale(1.2);
        }

        .message.recalled .message-bubble {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .message.recalled .message-bubble::after {
            content: '（已撤回）';
            display: block;
            font-size: 12px;
            margin-top: 4px;
            color: var(--text-secondary);
        }

        .message-bubble img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            cursor: pointer;
        }

        .read-status {
            font-size: 11px;
            color: var(--text-secondary);
            margin-left: 8px;
        }

        .read-status.read {
            color: #4CAF50;
        }

        .read-count {
            font-size: 11px;
            color: var(--text-secondary);
            margin-left: 8px;
        }

        .read-count:hover {
            color: var(--primary-color);
            cursor: pointer;
        }

        .reply-box {
            background: var(--bg-color);
            border-top: 2px solid var(--primary-color);
            padding: 12px 16px;
            display: none;
        }

        .reply-box.active {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .reply-box-content {
            flex: 1;
        }

        .reply-box-label {
            font-size: 12px;
            color: var(--primary-color);
            font-weight: 600;
        }

        .reply-box-text {
            font-size: 13px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reply-box-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        .reply-box-close:hover {
            color: var(--text-color);
        }

        .input-area {
            padding: 16px;
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
            transition: background 0.3s;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, background 0.3s, color 0.3s;
            background: var(--bg-secondary);
            color: var(--text-color);
        }

        .input-area input:focus {
            border-color: var(--primary-color);
        }

        .input-area button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-area button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }

        .input-area button:active {
            transform: translateY(0);
        }

        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .login-box {
            background: var(--bg-color);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .login-box h2 {
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
            background: var(--bg-secondary);
            color: var(--text-color);
        }

        .login-box input:focus {
            border-color: var(--primary-color);
        }

        .login-box button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-box button:hover {
            transform: translateY(-2px);
        }

        .emoji-btn, .image-btn, .search-btn {
            background: none;
            border: 2px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            color: var(--text-color);
        }

        .emoji-btn:hover, .image-btn:hover, .search-btn:hover {
            border-color: var(--primary-color);
            background: rgba(102, 126, 234, 0.1);
        }

        .file-btn {
            background: none;
            border: 2px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            color: var(--text-color);
        }

        .file-btn:hover {
            border-color: var(--primary-color);
            background: rgba(102, 126, 234, 0.1);
        }

        .file-preview {
            position: absolute;
            bottom: 80px;
            left: 60px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: none;
            max-width: 300px;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .file-preview.active {
            display: block;
        }

        .file-preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .file-preview-name {
            font-size: 14px;
            color: var(--text-color);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .file-preview-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            margin-left: 8px;
        }

        .file-preview-progress {
            width: 100%;
            height: 4px;
            background: var(--bg-secondary);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }

        .file-preview-progress-bar {
            height: 100%;
            background: var(--primary-gradient);
            width: 0%;
            transition: width 0.3s;
        }

        .message-file {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-color);
        }

        .message-file:hover {
            background: var(--hover-bg);
            border-color: var(--primary-color);
        }

        .message-file-icon {
            font-size: 24px;
        }

        .message-file-info {
            flex: 1;
        }

        .message-file-name {
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 150px;
        }

        .message-file-size {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .emoji-picker {
            position: absolute;
            bottom: 80px;
            left: 16px;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-color);
            padding: 12px;
            display: none;
            flex-wrap: wrap;
            max-width: 200px;
            gap: 8px;
        }

        .emoji-picker.active {
            display: flex;
        }

        .emoji-item {
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.2s;
            width: calc(25% - 8px);
            text-align: center;
        }

        .emoji-item:hover {
            background: var(--hover-bg);
            transform: scale(1.2);
        }

        .typing-indicator {
            position: absolute;
            bottom: 70px;
            left: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            display: none;
        }

        .typing-indicator.active {
            display: block;
        }

        .chat-mode-toggle {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .chat-mode-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .chat-mode-btn.active {
            background: white;
            color: var(--primary-color);
        }

        .room-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .room-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .private-chat-panel {
            position: absolute;
            top: 60px;
            right: 20px;
            width: 250px;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-color);
            display: none;
            max-height: 300px;
            overflow-y: auto;
            z-index: 50;
        }

        .private-chat-panel.active {
            display: block;
        }

        .private-chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: var(--text-color);
        }

        .private-chat-user {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
            color: var(--text-color);
        }

        .private-chat-user:hover {
            background: var(--hover-bg);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            font-weight: 600;
        }

        .private-target-info {
            flex: 1;
        }

        .private-target-name {
            font-size: 14px;
            color: var(--text-color);
            font-weight: 500;
        }

        .private-target-status {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .private-badge {
            background: #ff6b6b;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
        }

        .room-panel {
            position: absolute;
            top: 60px;
            left: 20px;
            width: 250px;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-color);
            display: none;
            max-height: 400px;
            overflow-y: auto;
            z-index: 50;
        }

        .room-panel.active {
            display: block;
        }

        .room-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            color: var(--text-color);
        }

        .room-item {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            color: var(--text-color);
        }

        .room-item:hover {
            background: var(--hover-bg);
        }

        .room-item.active {
            background: rgba(102, 126, 234, 0.1);
            color: var(--primary-color);
            font-weight: 600;
        }

        .room-create {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .room-create input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-color);
        }

        .room-create button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .mention-suggestions {
            position: absolute;
            bottom: 80px;
            left: 60px;
            background: var(--bg-color);
            border-radius: 8px;
            box-shadow: 0 4px 20px var(--shadow-color);
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 100;
        }

        .mention-suggestions.active {
            display: block;
        }

        .mention-suggestion {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
            color: var(--text-color);
        }

        .mention-suggestion:hover {
            background: var(--hover-bg);
        }

        .search-panel {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-color);
            display: none;
            z-index: 100;
        }

        .search-panel.active {
            display: block;
        }

        .search-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .search-header input {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-color);
        }

        .search-results {
            max-height: 400px;

        .avatar-preview {

        .settings-field input {

            outline: none;
        }

        .settings-field input:focus {
            border-color: var(--primary-color);
        }

        .settings-save {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .settings-save:hover {
            transform: translateY(-2px);
        }

        .call-panel {
            position: absolute;
            top: 60px;
            right: 20px;
            width: 280px;
            background: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow-color);
            display: none;
            z-index: 100;
        }

        .call-panel.active {
            display: block;
        }

        .call-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .call-header h3 {
            margin: 0;
            color: var(--text-color);
            font-size: 16px;
        }

        .call-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }

        .call-users {
            max-height: 300px;
            overflow-y: auto;
        }

        .call-user {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .call-user:last-child {
            border-bottom: none;
        }

        .call-user:hover {
            background: var(--hover-bg);
        }

        .call-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-color);
        }

        .call-user-name {
            font-size: 14px;
            font-weight: 500;
        }

        .call-buttons {
            display: flex;
            gap: 8px;
        }

        .call-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .call-btn:hover {
            transform: translateY(-2px);
        }

        .call-btn.voice {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }

        .call-btn.video {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
        }

        .incoming-call-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .incoming-call-modal.active {
            display: flex;
        }

        .incoming-call-content {
            background: var(--bg-color);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .incoming-call-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            margin: 0 auto 20px;
        }

        .incoming-call-text {
            color: var(--text-color);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .incoming-call-type {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .incoming-call-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .call-action-btn {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .call-action-btn.accept {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }

        .call-action-btn.reject {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
        }

        .call-action-btn:hover {
            transform: translateY(-2px);
        }

        .active-call-bar {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-color);
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 4px 20px var(--shadow-color);
            display: none;
            align-items: center;
            gap: 16px;
            z-index: 100;
        }

        .active-call-bar.active {
            display: flex;
        }

        .active-call-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .active-call-status {
            font-size: 14px;
            color: var(--text-color);
            font-weight: 500;
        }

        .active-call-controls {
            display: flex;
            gap: 8px;
        }

        .end-call-btn {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .end-call-btn:hover {
            transform: translateY(-2px);
        }

        .location-btn {
            background: none;
            border: 2px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            color: var(--text-color);
        }

        .location-btn:hover {
            border-color: var(--primary-color);
            background: rgba(102, 126, 234, 0.1);
        }

        .message-location {
            margin-top: 8px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .message-location:hover {
            border-color: var(--primary-color);
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .message-location-map {
            width: 100%;
            height: 150px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--primary-color);
            position: relative;
        }

        .message-location-map img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-location-info {
            padding: 8px 12px;
            background: var(--bg-color);
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message-location-info span:first-child {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h2>欢迎来到聊天室</h2>
            <input type="text" id="usernameInput" placeholder="输入你的昵称" maxlength="20" autocomplete="off">
            <button id="loginBtn">进入聊天室</button>
        </div>
    </div>

    <div class="chat-container">
        <div class="header">
            <h1>极简聊天室</h1>
            <div class="header-controls">
                <button class="theme-btn" id="themeBtn">🌙</button>
                <button class="search-btn" id="searchBtn">🔍</button>
                <button class="settings-btn" id="settingsBtn">⚙️</button>
                <button class="call-btn" id="callBtn">📞</button>
                <div class="chat-mode-toggle">
                    <button class="chat-mode-btn active" id="groupChatBtn">群聊</button>
                    <button class="chat-mode-btn" id="privateChatBtn">私聊</button>
                </div>
                <button class="room-btn" id="roomBtn">🏠 房间</button>
                <div class="users-list" id="usersList">
                    <span>在线：0 人</span>
                </div>
            </div>
        </div>

        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h3>个人设置</h3>
                <button class="settings-close" id="settingsClose">×</button>
            </div>
            <div class="settings-content">
                <div class="avatar-upload">
                    <div class="avatar-preview" id="avatarPreview">?</div>
                    <button class="avatar-upload-btn" id="avatarUploadBtn">上传头像</button>
                    <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                </div>
                <div class="settings-field">
                    <label>昵称</label>
                    <input type="text" id="nicknameInput" placeholder="输入新昵称" maxlength="20">
                </div>
                <button class="settings-save" id="settingsSaveBtn">保存设置</button>
            </div>
        </div>

        <div class="search-panel" id="searchPanel">
            <div class="search-header">
                <input type="text" id="searchInput" placeholder="搜索聊天记录...">
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

        <div class="private-chat-panel" id="privateChatPanel">
            <div class="private-chat-header">选择私聊对象</div>
            <div id="privateChatUsers"></div>
        </div>
        <div class="room-panel" id="roomPanel">
            <div class="room-header">选择聊天室</div>
            <div id="roomList"></div>
            <div class="room-create">
                <input type="text" id="newRoomInput" placeholder="新房间名称">
                <button id="createRoomBtn">创建</button>
            </div>
        </div>

        <div class="pinned-messages-bar" id="pinnedMessagesBar">
            <span style="font-weight: 600;">📌 置顶消息：</span>
            <div id="pinnedMessagesList"></div>
        </div>

        <div class="messages-area" id="messagesArea"></div>
        <div class="typing-indicator" id="typingIndicator"></div>
        <div class="emoji-picker" id="emojiPicker"></div>
        <div class="mention-suggestions" id="mentionSuggestions"></div>
        <div class="reaction-selector" id="reactionSelector">
            <span class="reaction-selector-item" data-emoji="👍">👍</span>
            <span class="reaction-selector-item" data-emoji="❤️">❤️</span>
            <span class="reaction-selector-item" data-emoji="😂">😂</span>
            <span class="reaction-selector-item" data-emoji="😮">😮</span>
            <span class="reaction-selector-item" data-emoji="😢">😢</span>
            <span class="reaction-selector-item" data-emoji="🔥">🔥</span>
        </div>
        <div class="file-preview" id="filePreview">
            <div class="file-preview-header">
                <div class="file-preview-name" id="filePreviewName"></div>
                <button class="file-preview-close" id="filePreviewClose">×</button>
            </div>
            <div class="file-preview-progress">
                <div class="file-preview-progress-bar" id="filePreviewProgressBar"></div>
            </div>
        </div>

        <!-- 通话状态栏 -->
        <div class="active-call-bar" id="activeCallBar">
            <div class="active-call-info">
                <span>📞</span>
                <span class="active-call-status" id="activeCallStatus">通话中...</span>
            </div>
            <div class="active-call-controls">
                <button class="end-call-btn" id="endCallBtn">挂断</button>
            </div>
        </div>

        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        
        <div class="reply-box" id="replyBox">
            <div class="reply-box-content">
                <div class="reply-box-label">回复</div>
                <div class="reply-box-text" id="replyBoxText"></div>
            </div>
            <button class="reply-box-close" id="replyBoxClose">×</button>
        </div>

        <div class="input-area">
            <button class="emoji-btn" id="emojiBtn">😀</button>
            <button class="image-btn" id="imageBtn">🖼️</button>
            <button class="file-btn" id="fileBtn">📎</button>
            <button class="location-btn" id="locationBtn">📍</button>
            <input type="file" id="fileInput" style="display: none;">
            <input type="text" id="messageInput" placeholder="输入消息..." maxlength="500" autocomplete="off">
            <button id="sendBtn">发送</button>
        </div>
    </div>

    <!-- 通话面板 -->
    <div class="call-panel" id="callPanel">
        <div class="call-header">
            <h3>📞 通话</h3>
            <button class="call-close" id="callClose">×</button>
        </div>
        <div class="call-users" id="callUsers"></div>
    </div>

    <!-- 来电弹窗 -->
    <div class="incoming-call-modal" id="incomingCallModal">
        <div class="incoming-call-content">
            <div class="incoming-call-avatar" id="incomingCallAvatar">?</div>
            <div class="incoming-call-text" id="incomingCallText">用户名</div>
            <div class="incoming-call-type" id="incomingCallType">语音通话</div>
            <div class="incoming-call-buttons">
                <button class="call-action-btn reject" id="rejectCallBtn">拒绝</button>
                <button class="call-action-btn accept" id="acceptCallBtn">接听</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
